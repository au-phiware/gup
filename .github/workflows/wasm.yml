name: WASM Compilation Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm_check:
    name: WASM Target Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Check WASM library compilation
        run: nix develop --command bash -c "cargo build --target wasm32-unknown-unknown --lib"

      - name: Build WASM package with wasm-pack
        run: nix develop --command bash -c "wasm-pack build --target web -- --features wasm-start"

      - name: Verify package output
        run: |
          for f in pkg/gup_bg.wasm pkg/gup.js; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing $f"
              exit 1
            fi
            echo "✅ $f produced"
          done

      - name: Verify axis benchmark export
        run: |
          if grep -q "run_wasm_axis_benchmarks" pkg/gup.js; then
            echo "✅ Axis benchmark function exported"
          else
            echo "❌ Missing axis benchmark export"
            exit 1
          fi

      # Known failure, tracked by GUP-285B: html_export_integration and
      # event_handling_tests do not compile for wasm32. continue-on-error keeps
      # the failure visible (an annotated step) without failing the workflow;
      # drop it when GUP-285B lands.
      - name: Check WASM test compilation (known failure, GUP-285B)
        continue-on-error: true
        run: nix develop --command bash -c "cargo build --target wasm32-unknown-unknown --tests"

      # NOTE: ChromeDriver now matches Chromium version (GUP-240).
      # Standard GitHub Actions runners lack GPU access so GPU-tier tests
      # will gracefully degrade.  CPU-only tests (mark types, registries)
      # should pass on any runner with headless Chrome.
      - name: Run WASM integration tests (best-effort)
        continue-on-error: true
        run: >
          nix develop --command bash -c
          "wasm-pack test --headless --chrome -- --test wasm_integration"

      - name: Run WASM axis performance tests (best-effort)
        continue-on-error: true
        run: >
          nix develop --command bash -c
          "wasm-pack test --headless --chrome -- --test wasm_axis_performance"
