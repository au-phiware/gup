name: WASM Compilation Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm_check:
    name: WASM Target Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Check WASM library compilation
        run: nix develop --command bash -c "cargo build --target wasm32-unknown-unknown --lib"
