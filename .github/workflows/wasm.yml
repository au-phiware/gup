name: WASM Compilation Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm_check:
    name: WASM Target Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Add wasm32 target
        run: nix develop --command bash -c "rustup target add wasm32-unknown-unknown"

      - name: Check WASM library compilation
        run: nix develop --command bash -c "cargo build --target wasm32-unknown-unknown --lib"

      - name: Build WASM package with wasm-pack
        run: nix develop --command bash -c "wasm-pack build --target web -- --features wasm-start"

      - name: Verify package output
        run: |
          test -f pkg/gup_bg.wasm && echo "✅ WASM binary produced" || (echo "❌ Missing WASM binary" && exit 1)
          test -f pkg/gup.js && echo "✅ JS bindings produced" || (echo "❌ Missing JS bindings" && exit 1)

      - name: Verify axis benchmark export
        run: |
          grep -q "run_wasm_axis_benchmarks" pkg/gup.js \
            && echo "✅ Axis benchmark function exported" \
            || (echo "❌ Missing axis benchmark export" && exit 1)

      - name: Check WASM test compilation
        run: >
          nix develop --command bash -c
          "cargo build --target wasm32-unknown-unknown --tests 2>&1
          && echo '✅ WASM tests compile'
          || echo '❌ WASM test compilation failed'"

      # NOTE: ChromeDriver now matches Chromium version (GUP-240).
      # Standard GitHub Actions runners lack GPU access so GPU-tier tests
      # will gracefully degrade.  CPU-only tests (mark types, registries)
      # should pass on any runner with headless Chrome.
      - name: Run WASM integration tests (best-effort)
        continue-on-error: true
        run: >
          nix develop --command bash -c
          "wasm-pack test --headless --chrome -- --test wasm_integration"

      - name: Run WASM axis performance tests (best-effort)
        continue-on-error: true
        run: >
          nix develop --command bash -c
          "wasm-pack test --headless --chrome -- --test wasm_axis_performance"
