# Platforms: render smoke tests on operating systems other than Linux
# (GUP-590). The Linux workflows run locally through `mask ci`; this one
# cannot, because it needs a Windows runner, so `maskfile.md` has no
# counterpart. Reproduce a step by hand on Linux with the same `cargo test`
# command (set WGPU_BACKEND=vulkan there).
name: Platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows render smoke (WARP, DX12)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The only adapter on a runner is WARP, the software D3D12 rasteriser.
      WGPU_BACKEND: dx12
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # .cargo/config.toml sets a bash rustc wrapper (GUP-411, per-checkout
      # artifacts); Windows cannot execute it, and CI has one checkout. An
      # empty value unsets it (checked with cargo 1.93: rustc runs unwrapped).
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; rustup reads it.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Registry only: the Windows test build is several GB and would evict
      # the other caches.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: platforms-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            platforms-${{ runner.os }}-cargo-

      # Spike: print the adapter first, so every later failure reads against
      # it. Fails if the backend is not DX12.
      - name: Adapter (must be DX12)
        run: cargo test -p gup --test platform_adapter -- --test-threads=1 --nocapture

      # Every root integration test: tutorial goldens, and the gallery
      # goldens when they exist. Doctests are not run on Windows.
      - name: Integration tests (goldens on WARP)
        run: cargo test -p gup --tests -- --test-threads=1 --nocapture

      # The harness writes actual and diff images under
      # <target dir>/visual-regression.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-golden-diffs
          path: target/visual-regression
          if-no-files-found: warn

  # GUP-591 spike. GitHub's standard macOS runners are virtual machines; the
  # Metal adapter they expose may be a reduced "Apple Paravirtual device" or
  # absent. The job is advisory (continue-on-error) until the spike's rule
  # (GUP-591 Decisions) is applied to the first runs' results. Standard
  # runner only: never `-xlarge` or self-hosted (an owner decision).
  macos:
    name: macOS render smoke (Metal)
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    env:
      WGPU_BACKEND: metal
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      # The bash wrapper in .cargo/config.toml would run on macOS, but it
      # calls sha256sum (not on macOS) and CI has one checkout, so unset it
      # as on Windows.
      CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: platforms-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            platforms-${{ runner.os }}-cargo-

      # Print the adapter before any golden test. If there is no Metal
      # adapter or it is a software one, the goldens are skipped with a
      # message (the spike rule then removes the job) rather than failing.
      - name: Adapter (must be Metal)
        id: adapter
        continue-on-error: true
        run: cargo test -p gup --test platform_adapter -- --test-threads=1 --nocapture

      - name: No usable Metal adapter
        if: steps.adapter.outcome != 'success'
        run: |
          echo "::warning::No usable Metal adapter on this runner; goldens skipped (GUP-591 rule: remove the job and record the result)."

      - name: Integration tests (goldens on Metal)
        if: steps.adapter.outcome == 'success'
        run: cargo test -p gup --tests -- --test-threads=1 --nocapture

      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-golden-diffs
          path: target/visual-regression
          if-no-files-found: warn
