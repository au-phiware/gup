name: Performance Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_multi_platform:
        description: 'Enable multi-platform testing'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Threshold-based performance regression tests (runs on every PR) ──
  perf_check:
    name: Performance Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Run mask perf-check
        id: perf_check
        run: |
          nix develop --command bash -c "mask perf-check" 2>&1 | tee perf_check_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload threshold test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-check-results-${{ github.sha }}
          path: perf_check_output.txt
          retention-days: 30

  # ── Unified performance alert (threshold tests + criterion comparison) ──
  performance:
    name: Performance Regression Testing (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "Software"
            runner: ubuntu-latest
            # Uncomment and configure when GPU runners are available:
          # - platform: "NVIDIA"
          #   runner: self-hosted-nvidia-gpu
          # - platform: "AMD"
          #   runner: self-hosted-amd-gpu
          # - platform: "Intel"
          #   runner: self-hosted-intel-gpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for trend analysis

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      # Restore criterion baselines keyed by branch for per-branch comparison
      - name: Restore cached baselines
        uses: actions/cache@v4
        with:
          path: |
            baselines/performance
            target/criterion
          key: perf-baselines-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            perf-baselines-${{ github.ref_name }}-
            perf-baselines-${{ github.base_ref || 'main' }}-
            perf-baselines-main-

      - name: Run performance CI test suite
        run: |
          nix develop --command bash -c "cargo test --test performance_ci_tests -- --test-threads=1 --nocapture"

      - name: Run perf_alert.sh
        id: perf_alert
        continue-on-error: true
        run: |
          nix develop --command bash -c "
            ./scripts/perf_alert.sh \
              --baseline main \
              --skip-benchmarks \
              --fail-on-regression \
              --report performance_report.md \
              --json performance_report.json
          "
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Check for regressions in CI report
        id: regression_check
        continue-on-error: true
        run: |
          if [ -f performance_report.json ]; then
            status=$(python3 -c "import json; d=json.load(open('performance_report.json')); print(d.get('status','pass'))" 2>/dev/null || echo "pass")
            echo "status=$status" >> $GITHUB_OUTPUT
            if [ "$status" = "fail" ]; then
              echo "⚠️ Performance regressions detected"
              exit 1
            fi
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ matrix.platform }}-${{ github.sha }}
          path: |
            performance_report.json
            performance_report.md
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('performance_report.md')) return;

            const report = fs.readFileSync('performance_report.md', 'utf8');

            // Find existing performance comment to update (avoids spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## ✅ Performance Report';
            const markerAlt = '## ❌ Performance Report';
            const markerWarn = '## ⚠️ Performance Report';
            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              (c.body.includes(marker) || c.body.includes(markerAlt) || c.body.includes(markerWarn))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

      - name: Fail on critical regressions
        if: steps.regression_check.outcome == 'failure'
        run: |
          echo "❌ Performance regressions detected. Review the performance report."
          exit 1

  # ── Cross-platform comparison (runs after all platform tests complete) ──
  cross_platform_comparison:
    name: Generate Cross-Platform Comparison
    runs-on: ubuntu-latest
    needs: performance
    if: always() && github.event.inputs.enable_multi_platform == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all platform reports
        uses: actions/download-artifact@v4
        with:
          path: platform-reports/

      - name: Generate comparison report
        run: |
          echo "# Cross-Platform Performance Comparison" > comparison_report.md
          echo "" >> comparison_report.md
          echo "**Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> comparison_report.md
          echo "" >> comparison_report.md

          echo "## Platforms Tested" >> comparison_report.md
          echo "" >> comparison_report.md
          for dir in platform-reports/*/; do
            if [ -f "$dir/performance_report.json" ]; then
              platform=$(jq -r '.platform_info.vendor // "Unknown"' "$dir/performance_report.json")
              model=$(jq -r '.platform_info.model // "Unknown"' "$dir/performance_report.json")
              echo "- $platform: $model" >> comparison_report.md
            fi
          done

          echo "" >> comparison_report.md
          echo "For detailed reports, see individual platform artifacts." >> comparison_report.md

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: cross-platform-comparison-${{ github.sha }}
          path: comparison_report.md
          retention-days: 30

      - name: Comment PR with comparison
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('comparison_report.md')) {
              const report = fs.readFileSync('comparison_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

  # ── Cross-platform axis performance validation (GUP-206) ──
  axis_performance:
    name: Axis Performance Validation (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "Linux"
            runner: ubuntu-latest
          # Uncomment to enable cross-platform axis performance validation:
          # - platform: "macOS"
          #   runner: macos-latest
          # - platform: "Windows"
          #   runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run axis performance tests
        if: runner.os != 'Windows'
        run: |
          nix develop --command bash -c "cargo test --test cross_platform_axis_performance_tests -- --test-threads=1 --nocapture 2>&1 | tee axis_performance_output.txt"

      - name: Run axis performance tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --test cross_platform_axis_performance_tests -- --test-threads=1 --nocapture 2>&1 | tee axis_performance_output.txt

      - name: Run axis criterion benchmarks
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          nix develop --command bash -c "cargo bench --bench axis_performance_benchmarks -- --save-baseline ${{ matrix.platform }}"

      - name: Extract report
        if: always()
        run: |
          if [ -f axis_performance_output.txt ]; then
            sed -n '/## Cross-Platform Axis Performance Report/,/^$/p' axis_performance_output.txt > axis_report.md || true
          fi

      - name: Upload axis performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axis-performance-${{ matrix.platform }}-${{ github.sha }}
          path: |
            axis_performance_output.txt
            axis_report.md
            target/criterion/
          retention-days: 30

  # ── WebAssembly axis performance validation (GUP-226) ──
  wasm_axis_performance:
    name: WASM Axis Performance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Add wasm32 target
        run: nix develop --command bash -c "rustup target add wasm32-unknown-unknown"

      - name: Verify WASM library compilation
        run: nix develop --command bash -c "cargo build --target wasm32-unknown-unknown --lib"

      - name: Build WASM package
        run: nix develop --command bash -c "wasm-pack build --target web --out-dir benches/wasm/pkg --release"

      - name: Verify axis benchmark export exists
        run: |
          grep -q "run_wasm_axis_benchmarks" benches/wasm/pkg/gup.js \
            && echo "✅ run_wasm_axis_benchmarks exported" \
            || (echo "❌ Missing axis benchmark export" && exit 1)

      - name: Run native axis benchmarks (WASM module unit tests)
        run: |
          nix develop --command bash -c "cargo test -p gup --lib wasm_bench_axis -- --test-threads=1 --nocapture 2>&1 | tee wasm_axis_test_output.txt"

      # ChromeDriver now matches Chromium version (GUP-240).
      # Note: headless Chrome tests require WebGPU support which may not
      # be available on standard GitHub Actions runners (no GPU). The step
      # uses continue-on-error to allow graceful degradation.
      - name: Run WASM axis benchmarks in headless Chrome
        continue-on-error: true
        run: |
          nix develop --command bash -c "wasm-pack test --headless --chrome -- --test wasm_axis_performance"

      # GUP-243: Capture HTML benchmark results via Puppeteer.
      # Loads axis_benchmarks.html?autorun in headless Chrome and extracts
      # window.__gupAxisResults as JSON. Uses continue-on-error because
      # the WASM benchmarks may require WebGPU which is unavailable on
      # standard GitHub Actions runners.
      - name: Install Puppeteer dependencies
        run: nix develop --command bash -c "cd scripts && npm ci"

      - name: Capture HTML benchmark results via Puppeteer
        continue-on-error: true
        run: |
          nix develop --command bash -c "node scripts/capture_wasm_benchmarks.js target/bench-results/wasm_axis_benchmarks.json"

      - name: Upload WASM axis results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-axis-performance-${{ github.sha }}
          path: |
            wasm_axis_test_output.txt
            target/bench-results/wasm_axis_benchmarks.json
            benches/wasm/pkg/
          retention-days: 30

  # ── Pattern-specific benchmarks for PRs (fast feedback) ──
  pattern_benchmarks_pr:
    name: Pattern Performance Benchmarks (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      # Restore criterion baselines per branch
      - name: Restore Criterion baselines
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baselines-${{ github.base_ref || 'main' }}-${{ github.sha }}
          restore-keys: |
            criterion-baselines-${{ github.base_ref || 'main' }}-
            criterion-baselines-main-

      - name: Run pattern benchmarks
        run: |
          nix develop --command bash -c "cargo bench --bench pattern_performance_benchmarks -- --save-baseline pr-${{ github.event.pull_request.number }}"

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          nix develop --command bash -c "cargo bench --bench pattern_performance_benchmarks -- --baseline main --save-baseline pr-${{ github.event.pull_request.number }}" > benchmark_comparison.txt 2>&1 || true

          if grep -q "Performance has regressed\|change:.*+[1-9][0-9]\{1,\}%" benchmark_comparison.txt; then
            echo "regression_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ Performance regression detected in pattern benchmarks"
          else
            echo "regression_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No significant performance regressions detected"
          fi

      - name: Generate benchmark summary
        if: always()
        run: |
          cat > benchmark_summary.md << 'EOF'
          ## 🎨 Pattern Benchmark Results

          **PR #${{ github.event.pull_request.number }}** — Pattern rendering performance analysis

          ### Summary

          Pattern benchmarks compare rendering performance for different pattern types
          (Solid, Dots, Lines, Crosshatch) across various data sizes.

          **Target**: <5ms overhead for 100K points with patterns

          ### Results

          EOF

          if [ -f benchmark_comparison.txt ]; then
            echo '```' >> benchmark_summary.md
            grep -A 2 "pattern_rendering_overhead\|pattern_uniform_updates\|pattern_pipeline_creation" benchmark_comparison.txt | head -30 >> benchmark_summary.md || echo "See full output in artifacts" >> benchmark_summary.md
            echo '```' >> benchmark_summary.md
          else
            echo "Benchmark comparison output not available. Check artifacts for full results." >> benchmark_summary.md
          fi

          echo "" >> benchmark_summary.md

          if [ "${{ steps.compare.outputs.regression_detected }}" = "true" ]; then
            cat >> benchmark_summary.md << 'EOF'
          ### ⚠️ Performance Regression Detected

          One or more benchmarks show regression exceeding the threshold
          configured in `perf-thresholds.toml`.

          **Action Required**: Review the changes and optimise or document the performance impact.

          EOF
          else
            cat >> benchmark_summary.md << 'EOF'
          ### ✅ No Significant Regressions

          Pattern rendering performance is within acceptable bounds.

          EOF
          fi

          echo "---" >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "**Note**: Benchmarks run on software rendering (no GPU). Results may differ on real hardware." >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "📊 Full benchmark results available in workflow artifacts." >> benchmark_summary.md

      - name: Upload benchmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pattern-benchmarks-pr-${{ github.event.pull_request.number }}
          path: |
            benchmark_comparison.txt
            benchmark_summary.md
            target/criterion/
          retention-days: 30

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchmark_summary.md')) return;

            const summary = fs.readFileSync('benchmark_summary.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🎨 Pattern Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }

      - name: Fail on critical regression
        if: steps.compare.outputs.regression_detected == 'true'
        run: |
          echo "❌ Critical performance regression detected. Review benchmark results."
          echo "If this regression is intentional, document it in the PR description."
          exit 1

  # ── Comprehensive benchmarking on main (saves baselines + records trends) ──
  benchmark:
    name: Comprehensive Benchmarking
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run comprehensive benchmarks
        run: |
          nix develop --command bash -c "cargo bench --all-features -- --save-baseline main"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 90

      # Save baselines per branch for PR comparisons
      - name: Cache baselines for PR comparisons
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baselines-main-${{ github.sha }}

      # Record trend data point
      - name: Record performance trend data
        run: |
          nix develop --command bash -c "./scripts/perf_trend.sh record" || true

      - name: Store benchmark history
        run: |
          mkdir -p .benchmark-history
          cp -r target/criterion .benchmark-history/${{ github.sha }}

      - name: Commit benchmark history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update benchmark history [${{ github.sha }}]"
          file_pattern: .benchmark-history/
          branch: benchmark-history
          create_branch: true
