name: Performance Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_multi_platform:
        description: 'Enable multi-platform testing'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  performance:
    name: Performance Regression Testing (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Multi-platform testing matrix
        # Note: GPU-specific runners require self-hosted infrastructure
        # For now, all tests run on ubuntu-latest (software rendering)
        # To enable GPU testing, set up self-hosted runners and update runner labels
        include:
          - platform: "Software"
            runner: ubuntu-latest
            # Uncomment and configure when GPU runners are available:
          # - platform: "NVIDIA"
          #   runner: self-hosted-nvidia-gpu
          # - platform: "AMD"
          #   runner: self-hosted-amd-gpu
          # - platform: "Intel"
          #   runner: self-hosted-intel-gpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for trend analysis

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Restore cached baselines
        uses: actions/cache@v3
        with:
          path: baselines/performance
          key: performance-baselines-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            performance-baselines-${{ github.ref }}-
            performance-baselines-main-

      - name: Run performance test suite
        run: |
          nix develop --command bash -c "cargo test --test performance_ci_tests -- --test-threads=1 --nocapture"

      - name: Check for performance regressions
        id: regression_check
        continue-on-error: true
        run: |
          if [ -f performance_report.json ]; then
            # Extract regression status from report
            regressions=$(jq '.test_results | map(select(.passed == false)) | length' performance_report.json)
            echo "regressions=$regressions" >> $GITHUB_OUTPUT
            if [ "$regressions" -gt 0 ]; then
              echo "⚠️ Performance regressions detected: $regressions test(s) failed"
              exit 1
            fi
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: performance-report-${{ matrix.platform }}-${{ github.sha }}
          path: |
            performance_report.json
            performance_report.md
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('performance_report.md')) {
              const report = fs.readFileSync('performance_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

      - name: Fail on critical regressions
        if: steps.regression_check.outcome == 'failure'
        run: |
          echo "❌ Performance regressions detected. Review the performance report."
          exit 1

  # Cross-platform comparison (runs after all platform tests complete)
  cross_platform_comparison:
    name: Generate Cross-Platform Comparison
    runs-on: ubuntu-latest
    needs: performance
    if: always() && github.event.inputs.enable_multi_platform == 'true'
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all platform reports
        uses: actions/download-artifact@v3
        with:
          path: platform-reports/

      - name: Generate comparison report
        run: |
          echo "# Cross-Platform Performance Comparison" > comparison_report.md
          echo "" >> comparison_report.md
          echo "**Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> comparison_report.md
          echo "" >> comparison_report.md
          
          # List all platforms tested
          echo "## Platforms Tested" >> comparison_report.md
          echo "" >> comparison_report.md
          for dir in platform-reports/*/; do
            if [ -f "$dir/performance_report.json" ]; then
              platform=$(jq -r '.platform_info.vendor // "Unknown"' "$dir/performance_report.json")
              model=$(jq -r '.platform_info.model // "Unknown"' "$dir/performance_report.json")
              echo "- $platform: $model" >> comparison_report.md
            fi
          done
          
          echo "" >> comparison_report.md
          echo "For detailed reports, see individual platform artifacts." >> comparison_report.md

      - name: Upload comparison report
        uses: actions/upload-artifact@v3
        with:
          name: cross-platform-comparison-${{ github.sha }}
          path: comparison_report.md
          retention-days: 30

      - name: Comment PR with comparison
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('comparison_report.md')) {
              const report = fs.readFileSync('comparison_report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }

  # Pattern-specific benchmarks for PRs (fast feedback)

  # Cross-platform axis performance validation (GUP-206)
  axis_performance:
    name: Axis Performance Validation (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "Linux"
            runner: ubuntu-latest
          # Uncomment to enable cross-platform axis performance validation:
          # - platform: "macOS"
          #   runner: macos-latest
          # - platform: "Windows"
          #   runner: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        if: runner.os != 'Windows'
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run axis performance tests
        if: runner.os != 'Windows'
        run: |
          nix develop --command bash -c "cargo test --test cross_platform_axis_performance_tests -- --test-threads=1 --nocapture 2>&1 | tee axis_performance_output.txt"

      - name: Run axis performance tests (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo test --test cross_platform_axis_performance_tests -- --test-threads=1 --nocapture 2>&1 | tee axis_performance_output.txt

      - name: Run axis criterion benchmarks
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          nix develop --command bash -c "cargo bench --bench axis_performance_benchmarks -- --save-baseline ${{ matrix.platform }}"

      - name: Extract report
        if: always()
        run: |
          # Extract the Markdown report from test output
          if [ -f axis_performance_output.txt ]; then
            sed -n '/## Cross-Platform Axis Performance Report/,/^$/p' axis_performance_output.txt > axis_report.md || true
          fi

      - name: Upload axis performance report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: axis-performance-${{ matrix.platform }}-${{ github.sha }}
          path: |
            axis_performance_output.txt
            axis_report.md
            target/criterion/
          retention-days: 30


  pattern_benchmarks_pr:
    name: Pattern Performance Benchmarks (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need history for baseline comparison

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Nix development environment
        run: nix develop --command bash -c "echo 'Nix environment ready'"

      - name: Restore Criterion baselines from main
        uses: actions/cache@v3
        with:
          path: target/criterion
          key: pattern-benchmarks-baselines-main-${{ github.base_ref }}
          restore-keys: |
            pattern-benchmarks-baselines-main-
            pattern-benchmarks-baselines-

      - name: Run pattern benchmarks
        run: |
          nix develop --command bash -c "cargo bench --bench pattern_performance_benchmarks -- --save-baseline pr-${{ github.event.pull_request.number }}"

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          nix develop --command bash -c "cargo bench --bench pattern_performance_benchmarks -- --baseline main --save-baseline pr-${{ github.event.pull_request.number }}" > benchmark_comparison.txt 2>&1 || true
          
          # Parse Criterion output for regressions
          # Criterion marks regressions with "Performance has regressed" or shows percentage changes
          if grep -q "Performance has regressed\|change:.*+[1-9][0-9]\{1,\}%" benchmark_comparison.txt; then
            echo "regression_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ Performance regression detected in pattern benchmarks"
          else
            echo "regression_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No significant performance regressions detected"
          fi

      - name: Generate benchmark summary
        if: always()
        run: |
          cat > benchmark_summary.md << 'EOF'
          ## 🎨 Pattern Benchmark Results
          
          **PR #${{ github.event.pull_request.number }}** - Pattern rendering performance analysis
          
          ### Summary
          
          Pattern benchmarks compare rendering performance for different pattern types (Solid, Dots, Lines, Crosshatch) across various data sizes.
          
          **Target**: <5ms overhead for 100K points with patterns
          
          ### Results
          
          EOF
          
          if [ -f benchmark_comparison.txt ]; then
            echo '```' >> benchmark_summary.md
            # Extract key metrics from Criterion output
            grep -A 2 "pattern_rendering_overhead\|pattern_uniform_updates\|pattern_pipeline_creation" benchmark_comparison.txt | head -30 >> benchmark_summary.md || echo "See full output in artifacts" >> benchmark_summary.md
            echo '```' >> benchmark_summary.md
          else
            echo "Benchmark comparison output not available. Check artifacts for full results." >> benchmark_summary.md
          fi
          
          echo "" >> benchmark_summary.md
          
          if [ "${{ steps.compare.outputs.regression_detected }}" = "true" ]; then
            cat >> benchmark_summary.md << 'EOF'
          ### ⚠️ Performance Regression Detected
          
          One or more benchmarks show >10% performance degradation compared to the main branch baseline.
          
          **Action Required**: Review the changes and optimize or document the performance impact.
          
          EOF
          else
            cat >> benchmark_summary.md << 'EOF'
          ### ✅ No Significant Regressions
          
          Pattern rendering performance is within acceptable bounds (≤10% variance).
          
          EOF
          fi
          
          echo "---" >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "**Note**: Benchmarks run on software rendering (no GPU). Results may differ on real hardware." >> benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "📊 Full benchmark results available in workflow artifacts." >> benchmark_summary.md

      - name: Upload benchmark comparison
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: pattern-benchmarks-pr-${{ github.event.pull_request.number }}
          path: |
            benchmark_comparison.txt
            benchmark_summary.md
            target/criterion/
          retention-days: 30

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('benchmark_summary.md')) {
              const summary = fs.readFileSync('benchmark_summary.md', 'utf8');
              
              // Find existing benchmark comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('🎨 Pattern Benchmark Results')
              );
              
              if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: summary
                });
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: summary
                });
              }
            }

      - name: Fail on critical regression
        if: steps.compare.outputs.regression_detected == 'true'
        run: |
          echo "❌ Critical performance regression detected. Review benchmark results."
          echo "If this regression is intentional, document it in the PR description."
          exit 1

  benchmark:
    name: Comprehensive Benchmarking
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run comprehensive benchmarks
        run: |
          nix develop --command bash -c "cargo bench --all-features -- --save-baseline main"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 90

      - name: Cache baselines for PR comparisons
        uses: actions/cache@v3
        with:
          path: target/criterion
          key: pattern-benchmarks-baselines-main-${{ github.ref }}

      - name: Store benchmark results for trend analysis
        run: |
          mkdir -p .benchmark-history
          cp -r target/criterion .benchmark-history/${{ github.sha }}

      - name: Commit benchmark history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update benchmark history [${{ github.sha }}]"
          file_pattern: .benchmark-history/
          branch: benchmark-history
          create_branch: true
