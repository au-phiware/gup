# Full test suite (GUP-398): every test in every workspace member, on Mesa's
# lavapipe (software Vulkan). Before this workflow nothing ran the root
# crate's full `cargo test` anywhere: the other workflows run named subsets.
#
# Like every workflow, this one never scopes by changed files: the local
# pre-commit hook may skip or narrow checks for small changes, CI always runs
# everything.
#
# Tests that assert a wall-clock budget are `#[ignore]`d with the reason
# "wall-clock budget: ... (GUP-398)": shared runners are too noisy for them.
# Never add a timing assertion to a functional test; the performance
# workflow is where budgets are tracked.
#
# `mask ci tests` runs the same commands locally.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: cargo test --workspace (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 111 integration-test binaries each link the whole crate. Without debug
    # info and stripped, they fit the runner's disk; with it they do not.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "debuginfo"
      CARGO_INCREMENTAL: "0"
      # Pin wgpu to Vulkan so lavapipe is the only adapter (GUP-403).
      WGPU_BACKEND: vulkan

    steps:
      - uses: actions/checkout@v4

      # The runner image ships about 20 GB of SDKs this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # rust-toolchain.toml pins the toolchain (GUP-403); rustup reads it, so
      # CI uses the same rustc and clippy as the Nix dev shell.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # lavapipe gives wgpu an adapter on a GPU-less runner; Xvfb gives
      # tests that open a window a display.
      - name: Install software GPU and X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 \
            xvfb xauth libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2

      # Registry only: the test build is several GB and would evict the other
      # workflows' caches.
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tests-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tests-${{ runner.os }}-cargo-

      - name: Test every workspace member
        run: xvfb-run -a cargo test --workspace -- --test-threads=1

      # The `debug` feature gates the profiling modules, their lib unit tests
      # and the integration tests with `required-features = ["debug"]`, which
      # the step above skips. The list comes from Cargo.toml, so a new gated
      # test cannot be left out.
      - name: Test the debug feature
        run: ./scripts/test_debug_feature.sh

      - name: Disk usage
        if: always()
        run: df -h /
