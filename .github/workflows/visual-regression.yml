# Visual regression (GUP-388): harness unit tests, chart-builder golden
# images with structural checks, the examples smoke test, and the quarantined
# gup-culling-lod crate (GUP-390); and gup-core rendered in headless Chrome
# (the browser job, GUP-408). `mask ci visual-regression` mirrors both jobs.
#
# GitHub runners have no GPU, so native wgpu runs on Mesa's lavapipe
# (software Vulkan) and the browser on Chrome's SwiftShader. Golden images
# were blessed on a hardware GPU; if lavapipe output differs beyond the
# perceptual tolerance, that is backend variance to be resolved deliberately
# (see tests/golden/README.md), never by loosening a structural check.

name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Build without debug info, stripped: the 109 example binaries take
    # about 1.3 GB instead of about 17 GB.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain (GUP-403); rustup reads it, so
      # CI uses the same rustc and clippy as the Nix dev shell.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: visual-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            visual-${{ runner.os }}-cargo-

      - name: Harness unit tests
        run: cargo test -p gup-visual-regression

      - name: Chart-builder golden images
        run: cargo test --lib visual_regression -- --test-threads=1

      # gup-culling-lod is quarantined (GUP-390): a workspace member but not a
      # default member, so nothing else builds it. Keep every target compiling
      # and its GPU tests passing so RFC-001 chunk culling can draw from it.
      - name: Quarantined culling/LOD crate
        run: |
          cargo check -p gup-culling-lod --all-targets --all-features
          cargo test -p gup-culling-lod -- --test-threads=1

      # gup-core (RFC-001) is not a default member; the Lint workflow lints
      # it with the rest of the workspace (GUP-398). Its tests include the
      # headless scatter golden image and a trybuild compile-fail suite. The
      # .stderr snapshots are rustc's exact wording, so they match only the
      # toolchain pinned in rust-toolchain.toml; re-bless them with
      # TRYBUILD=overwrite when the pin moves. gup-text (RFC-001 S2) is
      # gup-core's leaf text crate; its tests draw glyphs on the GPU. The S3
      # tests (GUP-401) draw one scene through every target, compare 1x and
      # 4x MSAA, and rasterise the SVG target with resvg against the PNG.
      - name: gup-core (RFC-001 core)
        run: |
          cargo test -p gup-text -- --test-threads=1
          cargo test -p gup-core --lib --test scatter_png --test targets \
            --test scene_items --test msaa --test svg -- --test-threads=1
          cargo test -p gup-core --doc
          cargo test -p gup-core --test compile_fail

      - name: Build examples
        run: cargo build --examples --all-features -p gup -p gup-culling-lod

      - name: Examples smoke test (skip list + headless runs)
        run: >-
          cargo test --all-features --test examples_smoke -- --include-ignored
          --test-threads=1

      - name: Upload renders and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: target/visual-regression
          if-no-files-found: ignore

  # gup-core in a real browser (GUP-408). Only a browser compiles the WGSL
  # gup-core hands to WebGPU (with Chrome's own compiler, not naga) and runs
  # Rust's wasm32 std; both have broken the browser path while every native
  # test passed (GUP-401). The runners have no GPU: Chrome's bundled
  # SwiftShader is the WebGPU adapter, the same one `mask wasm-browser` forces
  # locally, and the step summary records which adapter ran.
  browser:
    name: Browser smoke test (gup-core on WebGPU)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # The harness is its own workspace (and lockfile): cache its release
      # wasm build, including gup-core's build-time shader composition.
      - name: Cache Cargo registry and wasm build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: browser-${{ runner.os }}-cargo-${{ hashFiles('crates/gup-core/wasm-size/scatter/Cargo.lock', 'crates/gup-core/wasm-size/baseline/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            browser-${{ runner.os }}-cargo-

      # The CLI must match the harness's wasm-bindgen crate exactly.
      - name: Install wasm-bindgen (the harness's Cargo.lock version)
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' \
            crates/gup-core/wasm-size/scatter/Cargo.lock)
          name="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$name.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >>"$GITHUB_PATH"

      # Node 22+ for the DevTools-protocol driver's built-in WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A pinned Chrome for Testing build (it bundles SwiftShader). Move the
      # pin deliberately, like rust-toolchain.toml's.
      - name: Install Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 155.0.8059.39
          install-dependencies: true

      - name: Render the scatter in headless Chrome (mask wasm-browser)
        env:
          GUP_CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: ./scripts/wasm_browser.sh

      # gup-core's WASM size budget (GUP-417, RFC-001 §12 risk 10): fails when
      # the scatter costs more than 400,000 B gz over bare wgpu.
      - name: Check gup-core's WASM size budget (mask wasm-size)
        run: ./scripts/wasm_size.sh

      - name: Upload the browser's render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: target/visual-regression/gup_core/browser_scatter.png
          if-no-files-found: ignore
