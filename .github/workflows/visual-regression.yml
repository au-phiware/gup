# Visual regression (GUP-388): harness unit tests, chart-builder golden
# images with structural checks, and the examples smoke test.
#
# GitHub runners have no GPU, so wgpu runs on Mesa's lavapipe (software
# Vulkan). Golden images were blessed on a hardware GPU; if lavapipe output
# differs beyond the perceptual tolerance, that is backend variance to be
# resolved deliberately (see tests/golden/README.md), never by loosening a
# structural check.

name: Visual regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Build without debug info, stripped: the 109 example binaries take
    # about 1.3 GB instead of about 17 GB.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: "true"
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: visual-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            visual-${{ runner.os }}-cargo-

      - name: Harness unit tests
        run: cargo test -p gup-visual-regression

      - name: Chart-builder golden images
        run: cargo test --lib visual_regression -- --test-threads=1

      - name: Build examples
        run: cargo build --examples --all-features

      - name: Examples smoke test (skip list + headless runs)
        run: >-
          cargo test --all-features --test examples_smoke -- --include-ignored
          --test-threads=1

      - name: Upload renders and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: target/visual-regression
          if-no-files-found: ignore
