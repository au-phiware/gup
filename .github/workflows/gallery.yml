# Gallery CI — generates thumbnails and deploys the example gallery.
#
# Runs on every push to main.  Caches the Rust build and previously
# generated thumbnails so unchanged examples do not re-render.

name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Stripped release binaries keep the ~110 examples small on the runner.
      CARGO_PROFILE_RELEASE_STRIP: "true"

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain (GUP-403); rustup reads it, so
      # CI uses the same rustc and clippy as the Nix dev shell.
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      # Thumbnails are rendered headlessly; the runner has no GPU, so wgpu
      # uses Mesa's lavapipe (software Vulkan).
      # Examples built on `gup_core::show` draw in a real window and capture it,
      # so they need a display: Xvfb (as in visual-regression.yml).
      - name: Install software Vulkan (lavapipe) and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 libegl1 libgl1 \
            xvfb xauth libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: gallery-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            gallery-${{ runner.os }}-cargo-

      # Cache thumbnails keyed on the hash of all example source files.
      # If no example source changed, the entire thumbnail set is reused.
      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: docs/gallery/thumbs
          key: gallery-thumbs-${{ hashFiles('examples/**/*.rs') }}
          restore-keys: |
            gallery-thumbs-

      - name: Build (release)
        run: cargo build --release --examples

      - name: Check gallery config sync
        run: bash scripts/check_gallery_sync.sh

      - name: Generate thumbnails
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash scripts/generate_gallery.sh

      - name: Generate gallery HTML
        run: bash scripts/generate_gallery_html.sh

      - name: Validate source links
        run: bash scripts/check_gallery_links.sh

      - name: Upload gallery artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/gallery

  # GitHub Pages is not enabled for this repository yet, and deploy-pages
  # fails without it. Enable Pages (source: GitHub Actions) and set the
  # repository variable DEPLOY_GALLERY=true to publish the gallery.
  deploy:
    needs: build-gallery
    if: vars.DEPLOY_GALLERY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
