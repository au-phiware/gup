# Gallery configuration for GUP example thumbnails.
#
# Each [[examples]] entry maps to an example binary in examples/.
# Set `skip = true` for examples that cannot render a headless thumbnail
# (console-only, interactive-only, multi-window, web-only, or tool).
#
# The `category` field groups examples in the gallery HTML.
# The `source` field is the path to the example source file relative to the
# repository root.

[gallery]
thumb_width = 640
thumb_height = 480
output_dir = "docs/gallery/thumbs"
github_base = "https://github.com/au-phiware/gup/blob/main"

# ---------------------------------------------------------------------------
# Gallery
# ---------------------------------------------------------------------------

[[examples]]
name = "scatter_bubbles"
source = "examples/gallery/scatter_bubbles.rs"
description = "Bubble chart: size, colour and a log axis"
category = "Gallery"
skip = false

[[examples]]
name = "line_monotone"
source = "examples/gallery/line_monotone.rs"
description = "Three monotone-curve lines with month labels"
category = "Gallery"
skip = false

[[examples]]
name = "bar_grouped_labels"
source = "examples/gallery/bar_grouped_labels.rs"
description = "Grouped bars with a value label on every bar"
category = "Gallery"
skip = false

[[examples]]
name = "barh_ranked"
source = "examples/gallery/barh_ranked.rs"
description = "A ranking as horizontal bars with value labels"
category = "Gallery"
skip = false

[[examples]]
name = "area_stacked"
source = "examples/gallery/area_stacked.rs"
description = "Stacked areas with an outline"
category = "Gallery"
skip = false

# ---------------------------------------------------------------------------
# Basic
# ---------------------------------------------------------------------------

[[examples]]
name = "01_hello_chart"
source = "examples/basic/01_hello_chart.rs"
description = "Minimal scatter chart on gup-core"
category = "Basic"
skip = false

[[examples]]
name = "03_line_chart"
source = "examples/basic/03_line_chart.rs"
description = "Line chart with two colour series"
category = "Basic"
skip = false

[[examples]]
name = "04_bar_chart"
source = "examples/basic/04_bar_chart.rs"
description = "Grouped bar chart (--stacked to stack)"
category = "Basic"
skip = false

# ---------------------------------------------------------------------------
# Showcase
# ---------------------------------------------------------------------------

[[examples]]
name = "composite_mixed_data"
source = "examples/composite_mixed_data.rs"
description = "One plot over two row types: circles and a line"
category = "Charts & Marks"
skip = false

[[examples]]
name = "hello_world"
source = "examples/hello_world.rs"
description = "Hello world example"
category = "Basic"
skip = true
skip_reason = "Minimal example, no visual output"

