# Basic
# ---------------------------------------------------------------------------

[[examples]]
name = "01_hello_chart"
source = "examples/basic/01_hello_chart.rs"
description = "Minimal scatter plot (console output only)"
category = "Basic"
skip = true
skip_reason = "Console-only output, no GPU rendering"

