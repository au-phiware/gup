# Performance threshold configuration for CI regression detection.
#
# Each [[group]] defines a benchmark group with:
#   - name: identifier matching a benchmark or test group
#   - description: human-readable label for reports
#   - max_regression_percent: maximum allowed regression before failing CI (%)
#   - warning_percent: threshold for warning without failing (%)
#   - min_improvement_percent: notable improvement threshold for reporting (%)
#
# Thresholds apply to both criterion benchmarks and threshold-based tests.
# Criterion benchmarks compare wall-clock time; threshold tests use absolute
# limits that vary by build profile (debug vs release).

[defaults]
max_regression_percent = 15.0
warning_percent = 10.0
min_improvement_percent = 5.0

[[group]]
name = "interaction"
description = "Interaction system (point/region/batch queries)"
max_regression_percent = 20.0
warning_percent = 10.0
min_improvement_percent = 5.0

