# Tracked expected failures for the visual regression harness (GUP-388).
#
# Every case runs every check. An entry here only changes how a failure is
# REPORTED (XFAIL instead of FAIL). When the underlying bug is fixed, the
# check passes, the harness reports XPASS and the test fails until the entry
# is removed in the same change. Never "fix" an entry by loosening a
# threshold or an adapter's layout metadata.
#
# Fields:
#   case     - exact case name, or a prefix ending in '*'
#              (examples/<example>)
#   check    - render | not_blank | marks_present | text_present |
#              marks_confined | color_present | golden
#   reason   - what is broken, as observed (not as hoped)
#   tracking - the story or RFC-001 step whose completion removes the entry

# ---------------------------------------------------------------------------
# Examples (old `gup` path, frozen per RFC-001; verified 2026-10-04)
# ---------------------------------------------------------------------------

[[expected]]
case = "examples/gpu_debug_demo"
check = "render"
reason = "exits 1: ValidationError 'Failed to write CSV row: cannot serialize tuple container inside struct when writing headers from structs'"
tracking = "T7 gup-debug split (csv cannot write headers for array fields of a generic Serialize struct; GUP-390 only feature-gates this code)"

[[expected]]
case = "examples/pattern_pipeline_demo"
check = "render"
reason = "panics at src/accessibility/platform.rs:212 'Cannot start a runtime from within a runtime' (block_on inside the tokio main runtime)"
tracking = "RFC-001 S14 (old accessibility wiring replaced) / follow-up if the example survives"
