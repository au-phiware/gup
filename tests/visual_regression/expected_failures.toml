# Tracked expected failures for the visual regression harness (GUP-388).
#
# Every case runs every check. An entry here only changes how a failure is
# REPORTED (XFAIL instead of FAIL). When the underlying bug is fixed, the
# check passes, the harness reports XPASS and the test fails until the entry
# is removed in the same change. Never "fix" an entry by loosening a
# threshold or an adapter's layout metadata.
#
# Fields:
#   case     - exact case name, or a prefix ending in '*'
#              (chart_builders/<builder>, examples/<example>)
#   check    - render | not_blank | marks_present | text_present |
#              marks_confined | color_present | golden
#   reason   - what is broken, as observed (not as hoped)
#   tracking - the story or RFC-001 step whose completion removes the entry

# ---------------------------------------------------------------------------
# Chart builders (old `gup` path, frozen per RFC-001; verified 2026-10-04)
# ---------------------------------------------------------------------------

[[expected]]
case = "chart_builders/*"
check = "text_present"
reason = "render_to_rgba()/PNG output draws no text at all: no title, tick labels or colourbar labels (only the windowed path queues text)"
tracking = "RFC-001 S0a (headless PNG with title and tick labels); old path deleted at S14"

