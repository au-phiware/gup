# Examples the smoke test (tests/examples_smoke.rs) does not run headless.
#
# Almost every entry is a windowed example: it opens a winit window
# (EventLoop / ApplicationHandler, or the GupApp shell) and has no
# GUP_SCREENSHOT_PATH headless path, so it cannot run in CI without a display.
# The other entries never exit by design (e.g. an HTTP server).
#
# This list is expected to SHRINK over time as examples move to GupApp /
# headless-capable shells (GUP-375, GUP-376) or to the RFC-001 WindowTarget
# with GUP_SCREENSHOT_PATH support (RFC-001 S0b). The smoke test fails if:
#   - an entry names an example that no longer exists (remove it);
#   - a windowed example without a headless path is missing from this list;
#   - an example that supports GUP_SCREENSHOT_PATH is listed here.
#
# Windowed examples can still be exercised locally, with a display, via
#   GUP_SMOKE_WINDOWED=1 mask smoke-examples
# which runs each for a few seconds and fails on a panic or non-zero exit.
# Known windowed failures are tracked in expected_failures.toml.

