[package]
name = "gup-bevy"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A Bevy plugin that draws gup charts"
readme = "README.md"
keywords = ["chart", "plot", "visualization", "bevy", "gpu"]
categories = ["visualization", "game-engines"]

[dependencies]
gup-core = { workspace = true }
bevy = { version = "0.18", default-features = false, features = [
    "2d_bevy_render",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "png",
] }
wgpu = { version = "27.0", features = ["wgsl"] }
log = "0.4"

[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
gup-visual-regression = { path = "../crates/gup-visual-regression" }

[[example]]
name = "bevy_scatter"
path = "examples/bevy_scatter.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
