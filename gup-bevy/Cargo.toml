[package]
name = "gup-bevy"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "Bevy integration for the Gup GPU-accelerated data visualization library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "bevy", "gamedev", "data"]
categories = ["graphics", "visualization", "game-engines"]

[dependencies]
gup-core = { path = "../crates/gup-core" }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_asset",
    "bevy_winit",
    "bevy_sprite",
    "x11",
    "png",
] }
wgpu = { version = "27.0", features = ["wgsl"] }
log = "0.4"

[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
gup-visual-regression = { path = "../crates/gup-visual-regression" }

[[example]]
name = "bevy_scatter"
path = "examples/bevy_scatter.rs"
