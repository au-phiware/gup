[package]
name = "gup"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "GPU-Accelerated Data Visualization Library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "graphics", "webgpu", "data"]
categories = ["graphics", "visualization", "wasm"]

[lib]
name = "gup"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = "26.0"
winit = "0.30"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
  "Location",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
