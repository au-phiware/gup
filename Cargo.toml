[workspace]
members = ["gup-egui", "gup-bevy", "crates/gup-visual-regression", "crates/gup-core", "crates/gup-core-macros", "crates/gup-text", "crates/gup-wgsl"]
# The root package `gup` is a member implicitly; listing "." here would stop
# `exclude` from working (Cargo treats it as a prefix of every subdirectory).
# A plain `cargo build` / `cargo test` at the root builds only `gup`. The other
# members are built with `-p`.
default-members = ["."]
# `crates/gup-culling-lod` is parked (strategic review 2026-10, Decision 3): out
# of the workspace and CI. The iOS, Android and Tauri integrations were deleted
# in GUP-497.
exclude = ["crates/gup-culling-lod"]

[workspace.package]
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
homepage = "https://github.com/au-phiware/gup"
rust-version = "1.93"

# The published crates release together, and each requires its siblings by an
# exact version: the macro-generated code and the WGSL library text are an
# internal contract between gup-core-macros, gup-wgsl and gup-core.
[workspace.dependencies]
gup-core = { path = "crates/gup-core", version = "=0.1.0" }
gup-core-macros = { path = "crates/gup-core-macros", version = "=0.1.0" }
gup-wgsl = { path = "crates/gup-wgsl", version = "=0.1.0" }
gup-text = { path = "crates/gup-text", version = "=0.1.0" }

[package]
name = "gup"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Charts drawn on the GPU: scatter, line, bar, area, histogram, heatmap and box plots in a window, PNG, SVG, egui, Bevy or the browser"
readme = "README.md"
keywords = ["chart", "plot", "visualization", "gpu", "wgpu"]
categories = ["visualization", "graphics", "wasm"]
# What the facade ships: its source, examples and the documents its
# `cfg(doctest)` modules include. `tests/` needs the unpublished
# `gup-visual-regression`, and `docs/planning/` is history.
include = [
  "src/**",
  "examples/**",
  "/README.md",
  "/COPYING",
  "/Cargo.toml",
  "docs/TECHNICAL_APPROACH.md",
  "docs/IMPLEMENTATION_STRATEGY.md",
  "docs/tutorials/*.md",
]

[lib]
name = "gup"
crate-type = ["rlib"]

# The facade has no code of its own: `src/lib.rs` is `pub use gup_core::*`.
[dependencies]
# Not `workspace = true`: a member cannot turn off default features that the
# workspace entry leaves on, and gup-egui and gup-bevy want them on.
gup-core = { path = "crates/gup-core", version = "=0.1.0", default-features = false }

[features]
default = ["window", "svg"]
# A winit window target, `show` and `GupApp`.
window = ["gup-core/window"]
# Data marks in `SvgTarget`.
svg = ["gup-core/svg"]
# A `<canvas>` target and host (`web::CanvasApp`); wasm32 only.
web = ["gup-core/web"]

# Only what `tests/examples_smoke.rs` uses. The examples use `gup` alone.
[dev-dependencies]
gup-visual-regression = { path = "crates/gup-visual-regression" }
serde_json = "1.0"
toml_edit = { version = "0.23", default-features = false, features = ["parse"] }

[[example]]
name = "scatter_bubbles"
path = "examples/gallery/scatter_bubbles.rs"

