[features]
default = []
## GPU debugging, profiling and performance-report tooling: the `debug`,
## `performance`, `performance_export` and `performance_targets` modules and
## `GupContext`'s performance profiler. Off by default (GUP-390).
debug = []
## Live performance web dashboard (`debug::web_dashboard` server).
web-dashboard = ["debug", "tiny_http"]
## Feature gate for GPU benchmarks that require a GPU device.
gpu-bench = []
## Include `#[wasm_bindgen(start)]` entry point.
## Disable when running `wasm-pack test` (the test harness provides its own
## entry point and the duplicate `main` symbol causes a wasm-ld conflict).
wasm-start = []
## PDF export via `printpdf`.  Enables `PdfRenderer`, `PdfDocument`,
## `PdfOptions`, and the `export_pdf` convenience method on `ComposedChart`.
pdf = ["printpdf"]
## iOS embedding shim.  Enables the `platform::ios` module with Metal surface
## helpers, UITouch→TouchEvent translation, and the C ABI consumed by the
## companion Swift package in `pkg/ios/GupSwift/`.
ios-shim = []
## Android embedding shim.  Enables the `platform::android` module with
## ANativeWindow surface helpers, MotionEvent→TouchEvent translation, and the
## JNI C ABI consumed by the companion Kotlin library in
## `pkg/android/GupKotlin/`.
android-shim = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
