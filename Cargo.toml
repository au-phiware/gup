[workspace]
members = [".", "gup-macros"]

[package]
name = "gup"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "GPU-Accelerated Data Visualization Library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "graphics", "webgpu", "data"]
categories = ["graphics", "visualization", "wasm"]

[lib]
name = "gup"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "26.0", features = ["wgsl"] }
winit = "0.30"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.3"
raw-window-handle = "0.6"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }
futures-intrusive = "0.5"
futures-channel = "0.3"
env_logger = "0.10"
paste = "1.0"
gup-macros = { path = "gup-macros" }
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
  "Location",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio-test = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "mixable_benchmarks"
harness = false

[[bench]]
name = "buffer_benchmarks"
harness = false

[[example]]
name = "blend_modes_showcase"
path = "examples/blend_modes_showcase.rs"

[[example]]
name = "visual_blend_demo"
path = "examples/visual_blend_demo.rs"

[[example]]
name = "shader_pipeline_demo"
path = "examples/shader_pipeline_demo.rs"

[[example]]
name = "gpu_debug_demo"
path = "examples/gpu_debug_demo.rs"


