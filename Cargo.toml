[workspace]
members = ["gup-egui", "gup-bevy", "crates/gup-visual-regression", "crates/gup-core", "crates/gup-core-macros", "crates/gup-text", "crates/gup-wgsl"]
# The root package `gup` is a member implicitly; listing "." here would stop
# `exclude` from working (Cargo treats it as a prefix of every subdirectory).
# A plain `cargo build` / `cargo test` at the root builds only `gup`. The other
# members are built with `-p`.
default-members = ["."]
# `crates/gup-culling-lod` is parked (strategic review 2026-10, Decision 3): out
# of the workspace and CI. The iOS, Android and Tauri integrations were deleted
# in GUP-497.
exclude = ["crates/gup-culling-lod"]

[package]
name = "gup"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "GPU-Accelerated Data Visualization Library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "graphics", "webgpu", "data"]
categories = ["graphics", "visualization", "wasm"]

[lib]
name = "gup"
crate-type = ["rlib"]

# The facade has no code of its own: `src/lib.rs` is `pub use gup_core::*`.
[dependencies]
gup-core = { path = "crates/gup-core" }

# Only what `tests/examples_smoke.rs` uses. The examples use `gup` alone.
[dev-dependencies]
gup-visual-regression = { path = "crates/gup-visual-regression" }
serde_json = "1.0"
toml_edit = { version = "0.23", default-features = false, features = ["parse"] }

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "01_hello_chart"
path = "examples/basic/01_hello_chart.rs"

[[example]]
name = "03_line_chart"
path = "examples/basic/03_line_chart.rs"

[[example]]
name = "04_bar_chart"
path = "examples/basic/04_bar_chart.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
