[workspace]
members = [".", "gup-macros"]

[package]
name = "gup"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "GPU-Accelerated Data Visualization Library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "graphics", "webgpu", "data"]
categories = ["graphics", "visualization", "wasm"]

[lib]
name = "gup"
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "26.0", features = ["wgsl"] }
winit = "0.30"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.3"
raw-window-handle = "0.6"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
futures-intrusive = "0.5"
futures-channel = "0.3"
futures = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7" }
env_logger = "0.10"
paste = "1.0"
gup-macros = { path = "gup-macros" }
image = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
fontdue = "0.9"
unicode-normalization = "0.1"
ttf-parser = "0.21.1"
lru = "0.12"

# Web dashboard dependencies (optional, feature-gated)
tiny_http = { version = "0.12", optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
  "Location",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio-test = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "mixable_benchmarks"
harness = false

[[bench]]
name = "buffer_benchmarks"
harness = false

[[bench]]
name = "shader_performance_benchmarks"
harness = false

[[example]]
name = "blend_modes_showcase"
path = "examples/blend_modes_showcase.rs"

[[example]]
name = "visual_blend_demo"
path = "examples/visual_blend_demo.rs"

[[example]]
name = "shader_pipeline_demo"
path = "examples/shader_pipeline_demo.rs"

[[example]]
name = "gpu_debug_demo"
path = "examples/gpu_debug_demo.rs"

[[example]]
name = "web_dashboard_demo"
path = "examples/web_dashboard_demo.rs"
required-features = ["web-dashboard"]

[[example]]
name = "async_streaming_demo"
path = "examples/async_streaming_demo.rs"

# Basic examples - learning path
[[example]]
name = "01_hello_chart"
path = "examples/basic/01_hello_chart.rs"

[[example]]
name = "02_scatter_window"
path = "examples/basic/02_scatter_window.rs"

[[example]]
name = "03_line_chart"
path = "examples/basic/03_line_chart.rs"

[[example]]
name = "04_bar_chart"
path = "examples/basic/04_bar_chart.rs"

# Intermediate Examples
[[example]]
name = "styled_scatter"
path = "examples/intermediate/styled_scatter.rs"

[[example]]
name = "multi_series_line"
path = "examples/intermediate/multi_series_line.rs"

[[example]]
name = "categorical_bar"
path = "examples/intermediate/categorical_bar.rs"

# Showcase Examples
[[example]]
name = "business_dashboard"
path = "examples/showcase/business_dashboard.rs"

[features]
default = []
web-dashboard = ["tiny_http"]
