# WASM size baseline (GUP-401, RFC-001 §12 risk 10): the same kind of
# render (instanced quads, a uniform, offscreen target, async readback)
# with bare wgpu and a hand-written WGSL string: no naga, no gup-text.
# Same wgpu version and default features as gup-core. Build with
# `mask wasm-size`. (Until GUP-406 a `naga-oil` feature measured naga_oil
# composition on top: +896.7 KB gz. gup-core now composes at build time.)
[package]
name = "gup-core-wasm-size-baseline"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wgpu = { version = "27.0", features = ["wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"

[workspace]
