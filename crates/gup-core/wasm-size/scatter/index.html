<!doctype html>
<!-- Browser smoke test for gup-core (GUP-401, GUP-408): `mask wasm-browser`
     serves this page with the wasm-bindgen output of this crate, and
     scripts/browser_smoke.mjs watches its console in headless Chromium.
     The page logs, in order: `GUP ADAPTER …`, `GUPPNG <data URL>` and
     `GUP PASS …` or `GUP FAIL …`; the result line is always last. -->
<html>
  <head>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <pre id="out">pending</pre>
    <script type="module">
      import init, {
        render_scatter,
        render_categorical,
        render_scales,
        render_band_categorical,
        render_diverging,
      } from "./scatter.js";
      const out = document.getElementById("out");
      const [w, h] = [320, 200];
      let result;
      try {
        // The adapter the browser hands out for gup-core's request (wgpu
        // reports no adapter details on the web).
        const adapter = await navigator.gpu?.requestAdapter({
          powerPreference: "high-performance",
        });
        const info = adapter?.info;
        console.log(
          "GUP ADAPTER " +
            (info
              ? `vendor=${info.vendor} architecture=${info.architecture} ` +
                `fallback=${info.isFallbackAdapter}`
              : "none (no WebGPU)")
        );
        await init();
        const px = await render_scatter(w, h, 0);
        // The same scatter in column chunks of 32 rows (7 chunks, 7
        // instanced draws at their own dynamic offsets, RFC-001 S4a) must
        // give the same pixels, give or take 1/255 on a few edge pixels:
        // each chunk stores x relative to its own origin, so positions
        // round differently by about 1e-5 px. A wrong offset changes
        // thousands of pixels.
        const chunked = await render_scatter(w, h, 32);
        let chunkDiff = chunked.length === px.length ? 0 : w * h;
        let chunkWorst = 0;
        for (let i = 0; i < Math.min(px.length, chunked.length); i += 4) {
          let d = 0;
          for (let c = 0; c < 4; c++) {
            d = Math.max(d, Math.abs(px[i + c] - chunked[i + c]));
          }
          if (d > 0) chunkDiff++;
          chunkWorst = Math.max(chunkWorst, d);
        }
        let white = 0,
          grey = 0,
          coloured = 0;
        for (let i = 0; i < px.length; i += 4) {
          const [r, g, b] = [px[i], px[i + 1], px[i + 2]];
          if (r === 255 && g === 255 && b === 255) white++;
          else if (Math.abs(r - g) < 8 && Math.abs(g - b) < 8) grey++;
          else coloured++;
        }
        // A dictionary-encoded colour (RFC-001 S4b): four keys through
        // `encode_nullable_key` must draw in the first four Okabe-Ito
        // colours and missing keys in the null grey; a row with a NaN x is
        // not drawn (validity bits read in the vertex stage), so leaving the
        // row out gives the same pixels.
        const dict = await render_categorical(w, h, false);
        const dictDropped = await render_categorical(w, h, true);
        let dictDiff = dict.length === dictDropped.length ? 0 : w * h;
        for (let i = 0; i < Math.min(dict.length, dictDropped.length); i += 4) {
          for (let c = 0; c < 4; c++) {
            if (dict[i + c] !== dictDropped[i + c]) {
              dictDiff++;
              break;
            }
          }
        }
        const expected = [
          [0xe6, 0x9f, 0x00],
          [0x56, 0xb4, 0xe9],
          [0x00, 0x9e, 0x73],
          [0xf0, 0xe4, 0x42],
          [0x99, 0x99, 0x99],
        ];
        const dictCounts = expected.map(([r, g, b]) => {
          let n = 0;
          for (let i = 0; i < dict.length; i += 4) {
            if (
              Math.abs(dict[i] - r) <= 1 &&
              Math.abs(dict[i + 1] - g) <= 1 &&
              Math.abs(dict[i + 2] - b) <= 1
            )
              n++;
          }
          return n;
        });
        // The numeric scales (RFC-001 S5a): Time (a hi/lo column), Symlog,
        // a Sqrt radius and a fill through `Linear.then(Sqrt).then(viridis)`.
        // `render_scales` checks each point's colour against the chain's
        // CPU mirrors and a 1 ms Time zoom against the mirror's positions
        // itself, and throws on a mismatch.
        const scales = await render_scales(w, h);
        let scalesColoured = 0;
        for (let i = 0; i < scales.length; i += 4) {
          const [r, g, b] = [scales[i], scales[i + 1], scales[i + 2]];
          if (Math.abs(r - g) >= 8 || Math.abs(g - b) >= 8) scalesColoured++;
        }
        // The colour and ordinal scales (RFC-001 S5b): an 11-key
        // Categorical on a Band axis with its swatch legend and a hidden
        // null key, and a Diverging scale with its ramp. Each checks its
        // pixels against the CPU mirrors itself and throws on a mismatch;
        // here, each must draw some coloured ink (an empty plot fails).
        const band = await render_band_categorical(w, h);
        const diverging = await render_diverging(w, h);
        const colouredPx = img => {
          let n = 0;
          for (let i = 0; i < img.length; i += 4) {
            const [r, g, b] = [img[i], img[i + 1], img[i + 2]];
            if (Math.abs(r - g) >= 8 || Math.abs(g - b) >= 8) n++;
          }
          return n;
        };
        const bandColoured = colouredPx(band);
        const divergingColoured = colouredPx(diverging);
        const c = document.createElement("canvas");
        [c.width, c.height] = [w, 5 * h];
        const ctx = c.getContext("2d");
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(chunked), w, h),
          0,
          0
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(dict), w, h),
          0,
          h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(scales), w, h),
          0,
          2 * h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(band), w, h),
          0,
          3 * h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(diverging), w, h),
          0,
          4 * h
        );
        // The PNG is the chunked render, the dictionary render, the scales
        // render, the band/categorical render and the diverging render, top
        // to bottom.
        console.log("GUPPNG " + c.toDataURL("image/png"));
        // The scatter covers a fraction of the plot; a flooded plot (a
        // uniform-layout bug) or an empty one fails.
        const ok =
          coloured > 0.05 * w * h &&
          coloured < 0.4 * w * h &&
          grey > 1000 &&
          chunkDiff <= 64 &&
          chunkWorst <= 1 &&
          dictCounts.every(n => n >= 20) &&
          dictDiff === 0 &&
          scalesColoured > 200 &&
          bandColoured > 300 &&
          divergingColoured > 300;
        result = `${ok ? "PASS" : "FAIL"} white=${white} grey=${grey} coloured=${coloured} chunked-diff=${chunkDiff}px/${chunkWorst} dict=${dictCounts.join(",")} dict-null-row-diff=${dictDiff}px scales=${scalesColoured} band=${bandColoured} diverging=${divergingColoured}`;
      } catch (e) {
        result = "FAIL " + e;
      }
      out.textContent = result;
      console.log("GUP " + result);
    </script>
  </body>
</html>
