<!doctype html>
<!-- Browser smoke test for gup-core (GUP-401, GUP-408): `mask wasm-browser`
     serves this page with the wasm-bindgen output of this crate, and
     scripts/browser_smoke.mjs watches its console in headless Chromium.
     The page logs, in order: `GUP ADAPTER …`, `GUPPNG <data URL>` and
     `GUP PASS …` or `GUP FAIL …`; the result line is always last. -->
<html>
  <head>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <pre id="out">pending</pre>
    <script type="module">
      import init, {
        render_scatter,
        render_categorical,
        render_scales,
        render_band_categorical,
        render_diverging,
        render_user_function,
        show_scatter,
        show_gpu_scatter,
      } from "./scatter.js";
      const out = document.getElementById("out");
      const [w, h] = [320, 200];
      let result;
      try {
        // The adapter the browser hands out for gup-core's request (wgpu
        // reports no adapter details on the web).
        const adapter = await navigator.gpu?.requestAdapter({
          powerPreference: "high-performance",
        });
        const info = adapter?.info;
        console.log(
          "GUP ADAPTER " +
            (info
              ? `vendor=${info.vendor} architecture=${info.architecture} ` +
                `fallback=${info.isFallbackAdapter}`
              : "none (no WebGPU)")
        );
        await init();
        const px = await render_scatter(w, h, 0);
        // The same scatter in column chunks of 32 rows (7 chunks, 7
        // instanced draws at their own dynamic offsets, RFC-001 S4a) must
        // give the same pixels, give or take 1/255 on a few edge pixels:
        // each chunk stores x relative to its own origin, so positions
        // round differently by about 1e-5 px. A wrong offset changes
        // thousands of pixels.
        const chunked = await render_scatter(w, h, 32);
        let chunkDiff = chunked.length === px.length ? 0 : w * h;
        let chunkWorst = 0;
        for (let i = 0; i < Math.min(px.length, chunked.length); i += 4) {
          let d = 0;
          for (let c = 0; c < 4; c++) {
            d = Math.max(d, Math.abs(px[i + c] - chunked[i + c]));
          }
          if (d > 0) chunkDiff++;
          chunkWorst = Math.max(chunkWorst, d);
        }
        let white = 0,
          grey = 0,
          coloured = 0;
        for (let i = 0; i < px.length; i += 4) {
          const [r, g, b] = [px[i], px[i + 1], px[i + 2]];
          if (r === 255 && g === 255 && b === 255) white++;
          else if (Math.abs(r - g) < 8 && Math.abs(g - b) < 8) grey++;
          else coloured++;
        }
        // A dictionary-encoded colour (RFC-001 S4b): four keys through
        // `encode_nullable_key` must draw in the first four Okabe-Ito
        // colours and missing keys in the null grey; a row with a NaN x is
        // not drawn (validity bits read in the vertex stage), so leaving the
        // row out gives the same pixels.
        const dict = await render_categorical(w, h, false);
        const dictDropped = await render_categorical(w, h, true);
        let dictDiff = dict.length === dictDropped.length ? 0 : w * h;
        for (let i = 0; i < Math.min(dict.length, dictDropped.length); i += 4) {
          for (let c = 0; c < 4; c++) {
            if (dict[i + c] !== dictDropped[i + c]) {
              dictDiff++;
              break;
            }
          }
        }
        const expected = [
          [0xe6, 0x9f, 0x00],
          [0x56, 0xb4, 0xe9],
          [0x00, 0x9e, 0x73],
          [0xf0, 0xe4, 0x42],
          [0x99, 0x99, 0x99],
        ];
        const dictCounts = expected.map(([r, g, b]) => {
          let n = 0;
          for (let i = 0; i < dict.length; i += 4) {
            if (
              Math.abs(dict[i] - r) <= 1 &&
              Math.abs(dict[i + 1] - g) <= 1 &&
              Math.abs(dict[i + 2] - b) <= 1
            )
              n++;
          }
          return n;
        });
        // The numeric scales (RFC-001 S5a): Time (a hi/lo column), Symlog,
        // a Sqrt radius and a fill through `Linear.then(Sqrt).then(viridis)`.
        // `render_scales` checks each point's colour against the chain's
        // CPU mirrors and a 1 ms Time zoom against the mirror's positions
        // itself, and throws on a mismatch.
        const scales = await render_scales(w, h);
        let scalesColoured = 0;
        for (let i = 0; i < scales.length; i += 4) {
          const [r, g, b] = [scales[i], scales[i + 1], scales[i + 2]];
          if (Math.abs(r - g) >= 8 || Math.abs(g - b) >= 8) scalesColoured++;
        }
        // The colour and ordinal scales (RFC-001 S5b): an 11-key
        // Categorical on a Band axis with its swatch legend and a hidden
        // null key, and a Diverging scale with its ramp. Each checks its
        // pixels against the CPU mirrors itself and throws on a mismatch;
        // here, each must draw some coloured ink (an empty plot fails).
        const band = await render_band_categorical(w, h);
        const diverging = await render_diverging(w, h);
        // User functions written with `#[wgsl_function]` (RFC-001 S5c): a
        // radius through a user transfer function and the built-in Pow,
        // and a user colour function whose Params hold colours. It checks
        // its pixels against the mirrors itself and throws on a mismatch.
        const user = await render_user_function(w, h);
        const colouredPx = img => {
          let n = 0;
          for (let i = 0; i < img.length; i += 4) {
            const [r, g, b] = [img[i], img[i + 1], img[i + 2]];
            if (Math.abs(r - g) >= 8 || Math.abs(g - b) >= 8) n++;
          }
          return n;
        };
        const bandColoured = colouredPx(band);
        const divergingColoured = colouredPx(diverging);
        const userColoured = colouredPx(user);
        // Interactive scatter on a canvas (RFC-001 S8f): synthetic pointer
        // and wheel events through the DOM listeners of `CanvasApp`, read
        // back through hooks and by pixels.
        const frames = async () => {
          for (let i = 0; i < 2; i++)
            await new Promise(r => requestAnimationFrame(r));
        };
        let interactive = "ok";
        // Async GPU results (SwiftShader runs on the CPU) arrive after a
        // load-dependent number of frames: poll each frame until the hook
        // is true, failing only on a generous timeout, and report the
        // frames taken (max per step name) so latency stays visible.
        const taken = {};
        const within = async (name, hook) => {
          const t0 = performance.now();
          for (let f = 1; f <= 120 || performance.now() - t0 < 10000; f++) {
            await new Promise(r => requestAnimationFrame(r));
            if (hook()) {
              taken[name] = Math.max(taken[name] ?? 0, f);
              return true;
            }
            if (f >= 120 && performance.now() - t0 >= 10000) break;
          }
          return false;
        };
        let hoverPx = null;
        try {
          const canvas = document.createElement("canvas");
          canvas.style.cssText = `width:${w}px;height:${h}px;display:block`;
          document.body.appendChild(canvas);
          // AC3: a canvas that already has a 2d context cannot take a
          // WebGPU surface; show_scatter must reject, mentioning the canvas.
          const taken = document.createElement("canvas");
          taken.style.cssText = `width:${w}px;height:${h}px;display:block`;
          document.body.appendChild(taken);
          taken.getContext("2d");
          let rejected = null;
          try {
            await show_scatter(taken);
          } catch (e) {
            rejected = String(e);
          }
          if (!rejected || !/canvas/i.test(rejected))
            throw new Error("taken-context: " + rejected);
          const app = await show_scatter(canvas);
          const rect = canvas.getBoundingClientRect();
          const fire = (type, x, y, extra = {}) =>
            canvas.dispatchEvent(
              new PointerEvent(type, {
                bubbles: true,
                clientX: rect.left + x,
                clientY: rect.top + y,
                pointerId: 1,
                button: 0,
                ...extra,
              })
            );
          const step = async (name, check) => {
            if (interactive !== "ok") return;
            if (!(await check())) interactive = name;
          };
          const [rx, ry] = app.row_px(3);
          fire("pointermove", rx, ry);
          await frames();
          await step("hover", async () => {
            if (app.hovered_row() !== 3) return false;
            if (app.tooltip_text() !== "Kea\nx 55") return false;
            const [tx, ty, tw, th] = app.tooltip_rect();
            hoverPx = await app.render_rgba();
            let n = 0,
              white = 0,
              dark = 0;
            for (let y = Math.floor(ty); y < Math.ceil(ty + th); y++)
              for (let x = Math.floor(tx); x < Math.ceil(tx + tw); x++) {
                const i = (y * w + x) * 4;
                n++;
                const [r, g, b] = [hoverPx[i], hoverPx[i + 1], hoverPx[i + 2]];
                if (r >= 253 && g >= 253 && b >= 253) white++;
                if (r < 128 && g < 128 && b < 128) dark++;
              }
            return n > 0 && white >= 0.5 * n && dark >= 20;
          });
          canvas.dispatchEvent(new PointerEvent("pointerleave"));
          await frames();
          await step("leave", async () => {
            const t = [app.hovered_row(), app.tooltip_text()];
            return t[0] === -1 && t[1] == null;
          });
          const [cx1, cy1] = app.row_px(1);
          fire("pointerdown", cx1, cy1);
          fire("pointerup", cx1, cy1);
          await frames();
          await step(
            "click",
            async () => app.clicks() === 1 && app.last_clicked() === 1
          );
          // RFC-001 S9d: GPU picks at each row and at the empty plot
          // centre arrive through poll_picks a frame or more later.
          const [ex, ey] = app.plot_centre();
          const targets = [0, 1, 2, 3, 4, 5].map(i => [app.row_px(i), i]);
          targets.push([[ex, ey], -1]);
          for (const [[gx, gy], want] of targets) {
            await step("gpu-pick", async () => {
              app.request_pick(gx, gy);
              let done = [];
              const got = await within(
                "gpu-pick",
                () => (done = app.poll_picks()).length > 0
              );
              return got && done.length === 1 && done[0] === want;
            });
          }
          const [d0, d1] = app.x_domain();
          const [px, py] = app.plot_centre();
          const rect0 = app.plot_rect();
          const wheel = new WheelEvent("wheel", {
            bubbles: true,
            cancelable: true,
            clientX: rect.left + px,
            clientY: rect.top + py,
            deltaY: -120,
            deltaMode: 0,
          });
          canvas.dispatchEvent(wheel);
          await frames();
          await step("wheel", async () => {
            const [e0, e1] = app.x_domain();
            const want = (d1 - d0) * 0.85 ** 3;
            return (
              wheel.defaultPrevented && Math.abs((e1 - e0) / want - 1) <= 1e-9
            );
          });
          // The y labels lose their widest ("10"), yet the rect stays put
          // while the pointer is on the canvas (GUP-452).
          await step("held-rect", async () =>
            app.plot_rect().every((v, i) => v === rect0[i])
          );
          canvas.dispatchEvent(new PointerEvent("pointerleave"));
          await frames();
          await step("release", async () => app.plot_rect()[0] < rect0[0]);
          // Drag pan (GUP-453): press at the plot centre, three moves, then
          // release. The value under the pointer at the press is under it at
          // the end, row 3's dot moved with the pointer, and it was no click.
          {
            await frames();
            const [qx, qy] = app.plot_centre();
            const [r3x, r3y] = app.row_px(3);
            const start = app.value_at(qx, qy);
            const rect1 = app.plot_rect();
            const clicks0 = app.clicks();
            fire("pointerdown", qx, qy);
            for (let i = 1; i <= 3; i++)
              fire("pointermove", qx + 10 * i, qy + (20 / 3) * i);
            fire("pointerup", qx + 30, qy + 20);
            await frames();
            await step("pan", async () => {
              const end = app.value_at(qx + 30, qy + 20);
              const lo = app.x_domain();
              if (start.length !== 2 || end.length !== 2) return false;
              const rect2 = app.plot_rect();
              const wx = lo[1] - lo[0];
              // Relative to the domain's width (x); y by the plot's pixel
              // mapping, which is linear: 1e-9 of the value's size.
              const ok = (a, b, w) => Math.abs(a - b) <= 1e-9 * w;
              if (!ok(end[0], start[0], wx)) return false;
              if (!ok(end[1], start[1], Math.max(Math.abs(start[1]), 1)))
                return false;
              if (!rect2.every((v, i) => v === rect1[i])) return false;
              if (app.clicks() !== clicks0) return false;
              const [n3x, n3y] = app.row_px(3);
              if (Math.abs(n3x - (r3x + 30)) > 0.5) return false;
              if (Math.abs(n3y - (r3y + 20)) > 0.5) return false;
              // The dot is drawn there, in its fill #2a6fdb.
              const img = await app.render_rgba();
              const i = (Math.round(n3y) * w + Math.round(n3x)) * 4;
              const want = [0x2a, 0x6f, 0xdb];
              return want.every((c, k) => Math.abs(img[i + k] - c) <= 8);
            });
          }
          // Brush (GUP-454): drag over rows 1 and 2, grown by 10 px.
          {
            app.set_drag(2);
            await frames();
            const [ax, ay] = app.row_px(1);
            const [bx, by] = app.row_px(2);
            const box = [
              Math.min(ax, bx) - 10,
              Math.min(ay, by) - 10,
              Math.max(ax, bx) + 10,
              Math.max(ay, by) + 10,
            ];
            fire("pointerdown", box[0], box[1]);
            fire("pointermove", (box[0] + box[2]) / 2, (box[1] + box[3]) / 2);
            fire("pointermove", box[2], box[3]);
            fire("pointerup", box[2], box[3]);
            await frames();
            await step("brush", async () => {
              const rows = Array.from(app.brushed_rows());
              if (rows.length !== 2 || rows[0] !== 1 || rows[1] !== 2)
                return false;
              const img = await app.render_rgba();
              const i =
                (Math.round(box[1] + 3) * w + Math.round(box[0] + 3)) * 4;
              if (img[i + 2] - img[i] < 10) return false;
              // GUP-458: row 3, outside the brush, is its fill #2a6fdb at
              // opacity 0.3 over white.
              const [dx, dy] = app.row_px(3);
              const j = (Math.round(dy) * w + Math.round(dx)) * 4;
              const dim = [0x2a, 0x6f, 0xdb].map(c => 0.3 * c + 0.7 * 255);
              return dim.every((c, k) => Math.abs(img[j + k] - c) <= 8);
            });
            // Drag-zoom: the domain becomes the box's data extent.
            app.set_drag(3);
            await frames();
            const [qx, qy] = app.plot_centre();
            // Whole pixels: the host reads integer pointer offsets.
            const zb = [qx - 60, qy - 40, qx + 60, qy + 40].map(Math.round);
            const va = app.value_at(zb[0], zb[1]);
            const vb = app.value_at(zb[2], zb[3]);
            fire("pointerdown", zb[0], zb[1]);
            await frames();
            fire("pointermove", qx, qy);
            fire("pointermove", zb[2], zb[3]);
            fire("pointerup", zb[2], zb[3]);
            await frames();
            await step("drag-zoom", async () => {
              const [e0, e1] = app.x_domain();
              const ok = (a, b) => Math.abs(a - b) <= 1e-9 * Math.abs(b);
              return ok(e0, va[0]) && ok(e1, vb[0]);
            });
            app.reset_view();
            app.set_drag(0);
            await frames();
          }
          // GUP-481: a row appended with no input is drawn by the waker
          // alone. Only the appender and `appended_seen` touch the app:
          // `with_chart` (row_px, render_rgba) would schedule its own
          // frame. A WebGPU canvas reads back transparent in headless
          // SwiftShader (drawImage and DevTools screenshots), so the proof
          // is the accessor count, then the pixel in `render_rgba`.
          {
            const [p0x, p0y] = app.row_px(0);
            const [p1x, p1y] = app.row_px(1);
            const [p5x] = app.row_px(5);
            const nx = Math.round(p0x + ((50 - 10) / (85 - 10)) * (p5x - p0x));
            const ny = Math.round(p0y + ((9 - 3) / (7 - 3)) * (p1y - p0y));
            await frames();
            await step("append-before", async () => app.appended_seen() === 0);
            app.append_row(50, 9);
            await step("append-wake", () =>
              within("append-wake", () => app.appended_seen() > 0)
            );
            await step("append-pixel", async () => {
              const img = await app.render_rgba();
              const i = (ny * w + nx) * 4;
              return [0x2a, 0x6f, 0xdb].every(
                (c, k) => Math.abs(img[i + k] - c) <= 2
              );
            });
          }
          await step("last-error", async () => app.last_error() == null);
          app.free();
          // RFC-001 S9e: a GpuOnly layer hovers and clicks through GPU
          // picks, which land a frame or more after the event.
          const gcanvas = document.createElement("canvas");
          gcanvas.style.cssText = `width:${w}px;height:${h}px;display:block`;
          document.body.appendChild(gcanvas);
          const gpu = await show_gpu_scatter(gcanvas);
          const grect = gcanvas.getBoundingClientRect();
          const gfire = (type, x, y) =>
            gcanvas.dispatchEvent(
              new PointerEvent(type, {
                bubbles: true,
                clientX: grect.left + x,
                clientY: grect.top + y,
                pointerId: 1,
                button: 0,
              })
            );
          const rowPx = i => gpu.px_of(5 + 8 * i, [3, 7, 4, 8, 2][i % 5]);
          await frames();
          const [h5x, h5y] = rowPx(5);
          gfire("pointermove", h5x, h5y);
          // Nothing lands synchronously: the rows are not CPU-readable.
          await step("gpu-async", async () => gpu.hovered_row() === -1);
          await step("gpu-hover", () =>
            within("gpu-hover", () => gpu.hovered_row() === 5)
          );
          const [h7x, h7y] = rowPx(7);
          gfire("pointerdown", h7x, h7y);
          gfire("pointerup", h7x, h7y);
          await step("gpu-click", () =>
            within(
              "gpu-click",
              () => gpu.clicks() === 1 && gpu.last_clicked() === 7
            )
          );
          gcanvas.dispatchEvent(new PointerEvent("pointerleave"));
          await step("gpu-leave", () =>
            within("gpu-leave", () => gpu.hovered_row() === -1)
          );
          await step("gpu-clicks-once", async () => gpu.clicks() === 1);
          await step("gpu-last-error", async () => gpu.last_error() == null);
          gpu.free();
        } catch (e) {
          console.log("interactive failed: " + e);
          interactive = "error:" + e;
        }
        const takenText = Object.entries(taken)
          .map(([k, v]) => ` ${k}-frames=${v}`)
          .join("");
        const c = document.createElement("canvas");
        [c.width, c.height] = [w, 7 * h];
        const ctx = c.getContext("2d");
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(chunked), w, h),
          0,
          0
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(dict), w, h),
          0,
          h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(scales), w, h),
          0,
          2 * h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(band), w, h),
          0,
          3 * h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(diverging), w, h),
          0,
          4 * h
        );
        ctx.putImageData(
          new ImageData(new Uint8ClampedArray(user), w, h),
          0,
          5 * h
        );
        if (hoverPx)
          ctx.putImageData(
            new ImageData(new Uint8ClampedArray(hoverPx), w, h),
            0,
            6 * h
          );
        // The PNG is the chunked render, the dictionary render, the scales
        // render, the band/categorical render, the diverging render, the
        // user-function render and the hovered interactive scatter, top to
        // bottom.
        console.log("GUPPNG " + c.toDataURL("image/png"));
        // The scatter covers a fraction of the plot; a flooded plot (a
        // uniform-layout bug) or an empty one fails.
        const ok =
          coloured > 0.05 * w * h &&
          coloured < 0.4 * w * h &&
          grey > 1000 &&
          chunkDiff <= 64 &&
          chunkWorst <= 1 &&
          dictCounts.every(n => n >= 20) &&
          dictDiff === 0 &&
          scalesColoured > 200 &&
          bandColoured > 300 &&
          divergingColoured > 300 &&
          userColoured > 300 &&
          interactive === "ok";
        result = `${ok ? "PASS" : "FAIL"} white=${white} grey=${grey} coloured=${coloured} chunked-diff=${chunkDiff}px/${chunkWorst} dict=${dictCounts.join(",")} dict-null-row-diff=${dictDiff}px scales=${scalesColoured} band=${bandColoured} diverging=${divergingColoured} user=${userColoured} interactive=${interactive}${takenText}`;
      } catch (e) {
        result = "FAIL " + e;
      }
      out.textContent = result;
      console.log("GUP " + result);
    </script>
  </body>
</html>
