[package]
name = "gup-core"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "The engine behind gup: a GPU column store, typed channels, scales with CPU mirrors, marks, layout and render targets"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
publish = false

# `gup` re-exports `gup-core`, and `gup-core` never depends on `gup` or
# reaches into its modules.
# Versions match those already resolved in Cargo.lock (RFC-001 appendix).
#
# Shader composition runs at build time on every target (RFC-001 "Decisions
# (2026-10-09)", GUP-406): `build.rs` flattens the library (`gup-wgsl/library`)
# and the guide shaders (`src/shaders`) with naga_oil through gup-wgsl's
# `compose` feature, and at run time gup-wgsl's dependency-free linker joins
# generated glue to that text. naga and naga_oil are never linked into a
# gup-core binary.
[dependencies]
wgpu = { version = "27.0", features = ["wgsl"] }
gup-wgsl = { path = "../gup-wgsl" }
# `#[wgsl_function]` (GUP-420): user WGSL composed at compile time.
gup-core-macros = { path = "../gup-core-macros" }
encase = "0.12"
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.3"
futures-channel = "0.3"
image = { version = "0.24", default-features = false, features = ["png"] }
gup-text = { path = "../gup-text" }
thiserror = "2.0"
# `Instant` that works in browsers (std's panics on wasm32-unknown-unknown).
web-time = "1.1"
# `WindowTarget` and `show` (feature `window`, on by default).
winit = { version = "0.30", optional = true }

# Drives browser error-scope promises to completion (GUP-410). Already in
# the wasm build through wgpu's WebGPU backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# `web::CanvasApp` (feature `web`).
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "HtmlCanvasElement", "Element", "DomRect", "EventTarget", "Event",
  "MouseEvent", "PointerEvent", "WheelEvent", "AddEventListenerOptions",
  "Window", "console", "HtmlElement", "CssStyleDeclaration",
] }

[[example]]
name = "scatter_window"
required-features = ["window"]

[[example]]
name = "zoom_bench"
required-features = ["window"]

[features]
default = ["window", "svg"]
# Data marks in `SvgTarget` (GUP-467): the CPU mirrors and snapshots a layer
# keeps for vector output. Without it, `SvgTarget` writes guides only and a
# scene with a data layer is an error; the WASM size harness builds without it.
svg = []
# A winit window target and a minimal `show()`.
window = ["dep:winit"]
# A `<canvas>` target and host (`web::CanvasApp`); wasm32 only, no winit.
web = ["dep:web-sys", "dep:js-sys", "dep:wasm-bindgen"]

[dev-dependencies]
gup-visual-regression = { path = "../gup-visual-regression" }
# Rasterises `SvgTarget` output for comparison with the GPU render (the
# dogfood crate uses the same version).
resvg = { version = "0.45", default-features = false, features = ["text"] }
# Decodes the font `SvgTarget` embeds, independently of its own encoder.
base64 = "0.22"
trybuild = "1.0"
# Tests re-parse the linked WGSL (uniform layouts, struct checks) and
# compose the reference glue through naga_oil directly, as an oracle for
# the run-time linker. Never linked into a gup-core binary.
naga = { version = "27.0.3", features = ["wgsl-in"] }
gup-wgsl = { path = "../gup-wgsl", features = ["compose"] }

[build-dependencies]
gup-wgsl = { path = "../gup-wgsl", features = ["compose"] }
