[package]
name = "gup-core-macros"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Procedural macros for gup-core: #[wgsl_function] and #[derive(Mark)]"
readme = "README.md"
keywords = ["chart", "wgsl", "shader", "macro"]
categories = ["visualization", "development-tools::procedural-macro-helpers"]

# This macro takes authored WGSL,
# composes it with naga_oil against Gup's library at expansion through
# gup-wgsl's `compose` feature, and emits Rust only. Use it through
# `gup_core::wgsl_function`: the generated code names `::gup_core`.
[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
gup-wgsl = { workspace = true, features = ["compose"] }
# Reads the composed module's entry point and `Params` layout.
naga = { version = "27.0.3", features = ["wgsl-in"] }
# The `Params` twin's `encase::ShaderType` impl, rooted at gup-core's
# re-export so user crates need no `encase` dependency.
encase_derive_impl = "0.12"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
