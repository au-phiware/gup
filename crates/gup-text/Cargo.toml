[package]
name = "gup-text"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Text measurement and GPU glyph drawing for the gup charting library, with the Inter font bundled"
readme = "README.md"
keywords = ["text", "font", "glyph", "wgpu"]
categories = ["graphics", "rendering", "text-processing"]
# The bundled Inter font and its subset (`mask subset-inter`, GUP-407) are
# under the SIL Open Font License 1.1 (fonts/Inter-OFL.txt), not the
# crate's licence. Inter declares no Reserved Font Name, so the subset, a
# Modified Version, may keep the name "Inter" (OFL condition 3); it keeps
# the copyright and licence name records (condition 2).
include = ["src/**", "fonts/**", "tests/**", "README.md", "COPYING", "Cargo.toml"]

# RFC-001 §11: a leaf crate. It must never depend on `gup` or `gup-core`;
# `gup-core` depends on it. wgpu matches the version gup-core resolves.
[dependencies]
wgpu = { version = "27.0", features = ["wgsl"] }
bytemuck = { version = "1.23", features = ["derive"] }
fontdue = "0.9"
# The parser fontdue already links, with the features it enables (GUP-405).
ttf-parser = { version = "0.21", default-features = false, features = ["opentype-layout"] }
thiserror = "2.0"

[dev-dependencies]
pollster = "0.3"
# The shaping oracle for tests/shaping_oracle.rs only; never linked into a build.
rustybuzz = "0.20"
