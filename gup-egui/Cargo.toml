[package]
name = "gup-egui"
version = "0.1.0"
authors = ["Corin Lawson <corin@phiware.com.au>"]
edition = "2024"
description = "egui integration for the Gup GPU-accelerated data visualization library"
license = "GPL-3.0-or-later"
repository = "https://github.com/au-phiware/gup"
readme = "README.md"
keywords = ["gpu", "visualization", "egui", "gui", "data"]
categories = ["graphics", "visualization", "gui"]

[dependencies]
gup-core = { path = "../crates/gup-core" }
egui = "0.33"
eframe = { version = "0.33", features = ["wgpu"] }

[dev-dependencies]
env_logger = "0.10"
image = { version = "0.24", default-features = false, features = ["png"] }
pollster = "0.3"
gup-visual-regression = { path = "../crates/gup-visual-regression" }

[[example]]
name = "egui_chart"
path = "examples/egui_chart.rs"
