[package]
name = "gup-egui"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "An egui widget that draws gup charts"
readme = "README.md"
keywords = ["chart", "plot", "visualization", "egui", "gpu"]
categories = ["visualization", "gui"]

[dependencies]
gup-core = { workspace = true }
egui = "0.33"
eframe = { version = "0.33", features = ["wgpu"] }

[dev-dependencies]
env_logger = "0.10"
image = { version = "0.24", default-features = false, features = ["png"] }
pollster = "0.3"
gup-visual-regression = { path = "../crates/gup-visual-regression" }

[[example]]
name = "egui_chart"
path = "examples/egui_chart.rs"

# `test = true` runs the example's checks that every chapter's code regions exist.
[[example]]
name = "tour"
path = "examples/tour.rs"
test = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]
